spring.application.name=commerce-backend

# Aktives Spring-Profil (leer lassen fuer Default; z.B. "test" oder "prod" setzen)
spring.profiles.active=

# Elasticsearch-Verbindung
# localhost:9200 entspricht dem Service "elasticsearch" aus docker-compose.yml
# Beim lokalen Start ohne Docker muss Elasticsearch separat laufen.
elasticsearch.host=localhost
elasticsearch.port=9200

server.port=8080

# Pfad zur CSV-Datei (wird per CLI-Argument überschreibbar sein)
ingestion.csv.path=data/electronics_product.csv
ingestion.tv.filter=true
ingestion.inr-to-eur-rate=0.011

# Ollama (lokales Embedding-Modell)
# WSL2: Ollama läuft auf dem Windows-Host, erreichbar via Gateway-IP
ollama.base-url=http://172.26.112.1:11434
ollama.embedding-model=nomic-embed-text

# Google Gemini Flash (RAG-Agenten)
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-2.5-flash

# Ingestion: Embeddings während Import generieren
ingestion.embeddings.enabled=true
# Batch-Größe für Embedding-Requests an Ollama
ingestion.embeddings.batch-size=20

# Search
search.phase0.top-k=10
search.rrf.rank-constant=60
search.rrf.window-size=100

# RAG
rag.max-iterations=3

# Tracing
trace.output-dir=data/traces

# Inspiration / Diversity Search
search.diversity.segment1-max=250.0
search.diversity.segment2-max=600.0
search.diversity.products-per-segment=3
